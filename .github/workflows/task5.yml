name: 任务5 验收（systemless / hide / hijack）

# 任务5 的三套验收：
#   systemless_test  无修改系统逻辑：清单解析、属性端到端、基线比对、零写入自检
#   hide_test        特典：隐藏名单、挂载暴露面、摘挂载、守护进程、属性伪装
#   hijack_test      v0.2 前置：SwitchRoot 劫持布置（dry run 无副作用 / 变砖保护）
#
# 与 ci.yml 的分工和 components.yml 一样：ci.yml 每次提交必跑，这里跑的是
# 任务5 的边界与语义细节。
#
# 关键约束（照抄 components.yml 的教训）：GitHub runner 是**非 root**，
# 而摘挂载在真机上需要 root。所以涉及 setns/umount 的检查必须标 SKIP，
# 不许静默通过，也不许因为"提权失败"就让 CI 红掉——守护进程退出比失败更糟，
# 这个教训任务3 已经栽过一次（坑 7）。
#
# 只使用 GitHub 官方 action。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  task5:
    name: 任务5 深度验收（离线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 无修改系统逻辑
        run: bash tools/systemless_test.sh

      - name: 特典逻辑
        run: bash tools/hide_test.sh

      # 三套都按"非 root"设计：runner 是普通用户，需要 root 的检查会明确标
      # SKIP，绝不静默通过，也绝不因为提权失败就让 CI 红掉。
      #
      # ⚠️ 改任何一套之后，请以**两种身份**各跑一遍再提交（坑 7）：
      #   bash tools/xxx_test.sh                                        # root
      #   setpriv --reuid=65534 --regid=65534 --clear-groups bash ...   # 非 root
      # 只跑一种会得出错误结论——CI 用的是非 root 那一份。
      - name: SwitchRoot 劫持布置
        run: bash tools/hijack_test.sh

      - name: 失败诊断
        if: failure()
        run: |
          echo "--- 运行身份（非 root 时摘挂载相关检查会标 SKIP，属正常）---"
          id
          echo "--- BOSS 运行时目录 ---"
          ls -l /tmp/boss-test 2>/dev/null || echo "(无)"
          echo "--- 隐藏名单 ---"
          cat /tmp/boss-test/denylist.conf 2>/dev/null || echo "(无)"
          echo "--- 挂载快照 ---"
          cat /tmp/boss-test/mount.log 2>/dev/null || echo "(无)"
          echo "--- 属性伪装清单 ---"
          cat /tmp/boss-test/props.conf 2>/dev/null || echo "(无)"
          echo "--- 审计日志 ---"
          cat /tmp/boss-test/boss.log 2>/dev/null || echo "(无)"

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task5-test-logs
          path: /tmp/boss-test/boss.log
          if-no-files-found: ignore

  # 挂载表解析是任务5 两块功能的共同地基：verify 用它证明"改动只来自 /data"，
  # hide 用它找暴露面。两边各解析一次，判定标准迟早漂移（一边认 tmpfs 覆盖、
  # 另一边不认），症状是"verify 说干净、hide 却漏摘一条"。
  # 这个 job 守住"只有一份解析"这件事。
  mntinfo-guard:
    name: 挂载解析单一来源自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 只应有一处读 mountinfo
        run: |
          # 判据是"**真的打开了这个文件**"，不是"文件里出现过这个词"。
          # 之前按 mountinfo 这个词 grep，结果别的源文件在注释里提一句
          # "靠挂载表验收"就把 CI 打红了——那不是第二份实现，是误报。
          # 真正的第二份实现必然出现 "/proc/self/mountinfo" 这个路径字面量。
          n=$(grep -rlF "/proc/self/mountinfo" src/*.c | wc -l)
          echo "实际打开挂载表的源文件数：$n"
          if [ "$n" -ne 1 ]; then
            echo "ERROR: 挂载表解析出现了第二份实现，判定标准会漂移"
            grep -rnF "/proc/self/mountinfo" src/*.c || true
            exit 1
          fi

          # 顺带确认扫描函数只定义一次（防止有人复制一份到别处改名）
          m=$(grep -rl "int boss_mount_scan" src/*.c | wc -l)
          echo "定义 boss_mount_scan 的源文件数：$m"
          if [ "$m" -ne 1 ]; then
            echo "ERROR: boss_mount_scan 被定义了多次"
            grep -rn "int boss_mount_scan" src/*.c || true
            exit 1
          fi
          echo "OK: 解析唯一（src/mntinfo.c）"

      - name: 正常构建
        run: |
          make clean
          make test
          ./build/boss -V
          ./build/boss --list | grep -q systemless
          ./build/boss --list | grep -q hide
