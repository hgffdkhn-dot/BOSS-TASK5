name: Release

# 打 tag 就出包：Android 四个 ABI + Linux 静态 + 可直接喂给 veritpath 的 payload。
#   git tag v0.1.0 && git push origin v0.1.0
# 发布用 runner 自带的 gh CLI，不依赖第三方 action。

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的 tag
        required: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 NDK
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          if ! compgen -G "$SDK/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" > /dev/null; then
            SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            SM=${SM:-$(command -v sdkmanager)}
            [ -n "$SM" ] && { yes | "$SM" --licenses >/dev/null 2>&1 || true
              "$SM" --install "ndk;27.0.12077973" >/dev/null 2>&1 || true; }
          fi
          ls -d "$SDK"/ndk/* 2>/dev/null || true

      - name: 构建并组装 payload
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: |
          STRICT=1 MAKE_PAYLOAD=1 bash build/build-ndk.sh
          cd build/payload && zip -qr ../../dist/boss-payload.zip . && cd ../..
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: boss-android
          path: |
            dist/boss-android-*
            dist/boss-payload.zip
          if-no-files-found: error

  apk:
    name: BOSS App（客户端 APK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 版本链自检（先看清版本，再编）
        # 为什么要有这一步：AAR 元数据校验失败时会甩出 29 条
        # "requires AGP 9.1.0 / requires compileSdk 37"，而真实原因往往只有一条——
        # **推上去的仓库是旧的**（比如 AGP 还停在 8.9.0）。
        # 那 29 条里没有任何一条会告诉你"你编的是旧代码"。
        # 所以先把版本原样打出来、并对着下限做一次硬校验，
        # 版本不对就在这一步停掉，别等一分钟后看那面报错墙。
        env:
          GRADLE_VER: ${{ vars.GRADLE_VER || '9.3.1' }}
        run: |
          echo "=== gradle/libs.versions.toml 的实际取值 ==="
          grep -E '^(agp|kotlin|composeBom|material3) *=' gradle/libs.versions.toml || {
            echo "ERROR: 读不到版本目录——推上去的仓库不对，或者 gradle/ 没提交进来"; exit 1; }

          agp=$(grep -m1 -E '^agp *=' gradle/libs.versions.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          cs=$(grep -m1 -E '^ *compileSdk *=' app/build.gradle.kts | grep -oE '[0-9]+')

          echo
          echo "AGP        = ${agp:-未读到}"
          echo "compileSdk = ${cs:-未读到}"
          echo "Gradle     = $GRADLE_VER（本 job 要用）"

          ver_ge() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -1)" = "$2" ]; }

          [ -n "$agp" ] || { echo "ERROR: 没读到 agp 版本"; exit 1; }
          ver_ge "$agp" "9.1.0" || {
            echo "ERROR: AGP $agp < 9.1.0。"
            echo "       Compose 1.12.0 的 AAR 要求 AGP ≥ 9.1.0（硬校验，压不掉）。"
            echo "       如果是刚推完就跑的，先确认推的是最新那份——"
            echo "       这一步最常撞上的其实就是'推上去的还是旧仓库'。"; exit 1; }

          [ "$cs" = "37" ] || echo "[warn] compileSdk=$cs（期望 37）。若 AAR 校验报需要 37，改 app/build.gradle.kts。"

          ver_ge "$GRADLE_VER" "9.3.1" || {
            echo "ERROR: Gradle $GRADLE_VER < 9.3.1，AGP 9.1.1 的硬下限。"; exit 1; }

      - name: 装 SDK 平台 37 与 Build Tools 36.0.0（尽力而为，不阻断）
        # 需要的两样：compileSdk 37 → android-37 平台；AGP 9.1.1 → build-tools 36.0.0。
        #
        # ⚠️ 为什么"尽力而为、不阻断"：
        #    android-37 在 runner 的 sdkmanager 里**可能压根不存在**（渠道没发到、
        #    或这个 API 尚未公开到 stable 渠道）。那时 sdkmanager 报
        #      Warning: Failed to find package 'platforms;android-37'
        #    然后整条 job 挂掉——而真正的编译还没开始，等于白跑。
        #
        #    所以这里允许它失败，把已装的东西打出来，让**编译阶段**去给结论：
        #    能装上就编 37；装不上，下一步会自动退到 36 并重编。
        #    让真实的编译器说话，比在这里猜强。
        #
        # 另外 `yes | sdkmanager --licenses` 那条 "Broken pipe" 是正常现象
        # （sdkmanager 提前退出，yes 还在写），用 2>/dev/null 收掉噪声。
        continue-on-error: true
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          echo "SDK = $SDK"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          SM=${SM:-$(command -v sdkmanager)}
          if [ -z "$SM" ]; then
            echo "[warn] 找不到 sdkmanager——跳过安装，交给编译阶段判断"
          else
            yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" --install "platforms;android-37" "build-tools;36.0.0" 2>&1 \
              | grep -vE 'Broken pipe' || true
          fi
          echo "已装平台：";     ls "$SDK"/platforms    2>/dev/null || echo "  （读不到）"
          echo "已装 build-tools："; ls "$SDK"/build-tools 2>/dev/null || echo "  （读不到）"

      - name: 取一个确定版本的 Gradle
        # 仓库里没有 gradlew wrapper —— wrapper 的 jar 是二进制，我这边生成不了。
        # 所以显式下载固定版本，而不是依赖 runner 预装的 gradle：
        # 预装版本与 AGP 要求不符时，报错是 "Minimum supported Gradle version is ..."，
        # 而它不会告诉你该装哪个。钉死在这里改起来更直接。
        #
        # ⚠️ 9.3.1 是 AGP 9.1.1 的**硬下限**（官方兼容表）。
        #    改 gradle/libs.versions.toml 里的 agp 时，必须同步这里的 GRADLE_VER——
        #    这两处不一致，会在 sync 阶段就挂掉。
        env:
          GRADLE_VER: ${{ vars.GRADLE_VER || '9.3.1' }}
        run: |
          echo "下载 Gradle $GRADLE_VER"
          cd /tmp
          curl -sSLO "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          unzip -q "gradle-${GRADLE_VER}-bin.zip"
          echo "$PWD/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"

      - name: 构建 APK（装不上 android-37 时自动退到 36）
        # 用 assembleDebug 而不是 Release：Release 需要签名密钥，
        # 而仓库里不该放密钥。要签发正式包时，在 CI 里配 secrets 并
        # 在 app/build.gradle.kts 增加 signingConfig，别把 keystore 提交进来。
        #
        # ⚠️ 为什么带回退：
        #    android-37 平台不一定装得上（上一步已经尽力了）。
        #    装不上时 AGP 报 "Failed to find target with hash string 'android-37'"，
        #    而那时**整条链还没真跑过**——我们并不确定 37 之外还有什么问题。
        #
        #    所以：先试 37；失败就把 compileSdk 改成 36 再试一次。
        #    36 那条路同样会撞上 Compose 1.12.0 的 AAR 硬校验
        #    （它要求 compileSdk ≥ 37），所以**预期也会失败**——
        #    但两次失败放一起看，能立刻分清是"平台装不上"还是"版本链不对"，
        #    而不是对着一条报错猜。
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: |
          mkdir -p dist
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          echo "可用平台：$(ls "$SDK"/platforms 2>/dev/null | tr '\n' ' ')"

          if gradle :app:assembleDebug --no-daemon --stacktrace; then
            echo "[ok] compileSdk 37 构建成功"
          else
            echo "[i] 37 失败。先看是不是平台根本没装上："
            if ! ls -d "$SDK"/platforms/android-37* >/dev/null 2>&1; then
              echo "    → android-37 平台不存在。改用 compileSdk 36 重试一次，"
              echo "      用两次结果来区分'平台缺失'与'版本链不对'。"
              sed -i 's/^ *compileSdk = 37/    compileSdk = 36/' app/build.gradle.kts
              grep -n 'compileSdk' app/build.gradle.kts | grep -v '^ *[0-9]*: *\*'
              gradle :app:assembleDebug --no-daemon --stacktrace || {
                echo "36 也失败 —— 说明不是平台问题，是版本链（AGP/Gradle/Compose BOM）的问题。"
                echo "对照 docs/TASK6-整合与出包.md 4.5 节检查四个版本。"
                exit 1; }
            else
              echo "    → 平台在，那就是版本链的问题（不是平台缺失）。直接失败。"
              exit 1
            fi
          fi

          cp app/build/outputs/apk/debug/app-debug.apk dist/boss-app-debug.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: boss-app
          path: dist/boss-app-debug.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 静态二进制（x86_64 / aarch64）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          mkdir -p dist
          make static
          cp build/boss-static dist/boss-linux-x86_64
          aarch64-linux-gnu-gcc -O2 -std=c11 -Wall -Wextra -DBOSS_NO_DLOPEN \
            -static-pie -Isrc src/*.c -o dist/boss-linux-aarch64

      - name: 冒烟测试仍然要过
        run: bash tools/smoke_test.sh

      # 出包前把任务3 组件的边界语义也过一遍：
      # 发布的是给用户刷机的二进制，静默读错属性这类问题必须挡在发布前。
      - name: 组件深度验收也要过
        run: bash tools/component_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: boss-linux
          path: dist/boss-linux-*
          if-no-files-found: error

  release:
    needs: [android, apk, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh 必须在 git 仓库里运行：它靠 .git 推断目标仓库（owner/repo）。
      # 这个 job 以前只下载 artifact、没有 checkout，于是 gh 直接
      # "fatal: not a git repository" 失败。artifact 是别的 job 产出的，
      # 但 gh 不关心产物从哪来，它只认工作目录里的 .git。
      # fetch-depth: 0 是为了让 gh release create 在 tag 尚不存在时
      # 能正确定位默认分支 HEAD。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打包并算校验和
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt && ls -l

      - name: 自检（发布前把环境说清楚，失败了不用猜）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "TAG=$TAG"
          echo "git repo: $(git rev-parse --show-toplevel 2>&1)"
          echo "remote  : $(git remote get-url origin 2>&1)"
          # 提前暴露问题：没有 token / 不在仓库里 / out 为空，
          # 否则错误会推迟到 gh 那一步，信息更少。
          [ -n "$TAG" ] || { echo "ERROR: TAG 为空"; exit 1; }
          ls -l out | sed -n '1,20p'
          [ -n "$(ls -A out)" ] || { echo "ERROR: out 是空的"; exit 1; }
          gh --version | head -1
          gh repo view --json nameWithOwner -q .nameWithOwner

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --generate-notes
          fi
