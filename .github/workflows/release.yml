name: Release

# 打 tag 就出包：Android 四个 ABI + Linux 静态 + 可直接喂给 veritpath 的 payload。
#   git tag v0.1.0 && git push origin v0.1.0
# 发布用 runner 自带的 gh CLI，不依赖第三方 action。

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的 tag
        required: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 NDK
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          if ! compgen -G "$SDK/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" > /dev/null; then
            SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            SM=${SM:-$(command -v sdkmanager)}
            [ -n "$SM" ] && { yes | "$SM" --licenses >/dev/null 2>&1 || true
              "$SM" --install "ndk;27.0.12077973" >/dev/null 2>&1 || true; }
          fi
          ls -d "$SDK"/ndk/* 2>/dev/null || true

      - name: 构建并组装 payload
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: |
          STRICT=1 MAKE_PAYLOAD=1 bash build/build-ndk.sh
          cd build/payload && zip -qr ../../dist/boss-payload.zip . && cd ../..
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: boss-android
          path: |
            dist/boss-android-*
            dist/boss-payload.zip
          if-no-files-found: error

  apk:
    name: BOSS App（客户端 APK）
    # ⚠️ runner 镜像**钉死**，不用 ubuntu-latest。
    #    ubuntu-latest 会随时间漂移（今天 24.04，明天可能 26.04），
    #    而它自带的 Android SDK / cmdline-tools 版本跟着变。
    #    这次的 android-37 装不上，本质就是镜像里的 sdkmanager 渠道太旧。
    #    钉死后环境是确定的；要升级镜像时是**有意改的一次提交**，不是某天突然红。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 清掉残留的旧图标文件（先清，再检查）
        # 这个文件为什么需要 CI 自己动手删：
        #   ic_boss.xml 已经从 Manifest 的引用链上摘掉了，
        #   但**只要文件还在，aapt 就会编译它**——资源链接照样失败。
        #   而它在任何引用关系里都看不见，所以：
        #     · 本地删了、没 git add -A 提交删除 → 推上去别人拉的还是有
        #     · 手工排查永远发现不了它（Manifest 看着完全正常）
        #   已经连续三轮卡在这儿了，所以不再依赖人工，交给 CI 自己清。
        #   这是**幂等**的：文件不存在就什么都不做。
        run: |
          for f in app/src/main/res/drawable/ic_boss.xml \
                   app/src/main/res/drawable/ic_launcher.xml; do
            if [ -f "$f" ]; then rm -f "$f"; echo "已删除 $f"; fi
          done
          echo "当前 drawable/：$(ls app/src/main/res/drawable/ 2>/dev/null | tr '\n' ' ')"

      - name: 工具链自检（复用 tools/check_android_toolchain.sh）
        # 为什么不在这里内联写一遍：
        #   之前内联了一版，只查 AGP/compileSdk。后来又陆续踩到
        #   "kotlin.android 在 AGP 9 下不能声明"、"资源里 ?attr 没声明"，
        #   每踩一次就往 CI 里加一段 —— 逻辑越来越长，而且本地还得另跑一份。
        #   现在统一由脚本承担，CI 与本地是同一份判断。
        env:
          GRADLE_VER: ${{ vars.GRADLE_VER || '9.3.1' }}
        run: bash tools/check_android_toolchain.sh

      - name: 取最新 cmdline-tools（不依赖镜像预装的 sdkmanager）
        # 为什么不用镜像里那个：
        #   上一次就是它报 "Failed to find package 'platforms;android-37'"——
        #   预装的 sdkmanager 版本太旧，渠道里根本没有这个包。
        #   换成官方 latest 通道的 cmdline-tools，才有机会看到 android-37。
        #
        # 布局要求：sdkmanager 必须落在 $SDK/cmdline-tools/latest/bin/ 下，
        #   直接解压出去用会报 "Could not determine SDK root"。
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          echo "SDK = $SDK"
          cd /tmp
          curl -sSLO "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          rm -rf cmdline-tools
          unzip -q commandlinetools-linux-*_latest.zip
          mkdir -p "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          echo "$SM 版本：" ; "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: 探测 android-37 在不在渠道里（先看清，再决定）
        # 关键判断：**列出来看**，而不是直接装、失败就猜。
        #   装不到的时候，"渠道里没有"和"网络失败/参数错"长得一模一样，
        #   只有 --list 能把这两种分开。
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "=== 可用 platforms（grep 35 以上）==="
          "$SM" --list 2>/dev/null | grep -E '^ *platforms;android-(3[5-9]|[4-9][0-9])' | sed 's/^/    /' \
            || echo "    （没列出来——可能是网络问题，也可能是渠道里真没有）"
          echo
          echo "=== 已装 ==="
          "$SM" --list_installed 2>/dev/null | grep -E 'platforms;|build-tools;' | sed 's/^/    /' || true

      - name: 装 SDK 平台 37 与 Build Tools 36.0.0（尽力而为，不阻断）
        # 需要的两样：compileSdk 37 → android-37 平台；AGP 9.1.1 → build-tools 36.0.0。
        #
        # ⚠️ 为什么"尽力而为、不阻断"：
        #    android-37 在 runner 的 sdkmanager 里**可能压根不存在**（渠道没发到、
        #    或这个 API 尚未公开到 stable 渠道）。那时 sdkmanager 报
        #      Warning: Failed to find package 'platforms;android-37'
        #    然后整条 job 挂掉——而真正的编译还没开始，等于白跑。
        #
        #    所以这里允许它失败，把已装的东西打出来，让**编译阶段**去给结论：
        #    能装上就编 37；装不上，下一步会自动退到 36 并重编。
        #    让真实的编译器说话，比在这里猜强。
        #
        # 另外 `yes | sdkmanager --licenses` 那条 "Broken pipe" 是正常现象
        # （sdkmanager 提前退出，yes 还在写），用 2>/dev/null 收掉噪声。
        continue-on-error: true
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          # 用刚装上的 latest 那一份，不再用镜像预装的旧 sdkmanager
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            echo "[warn] 找不到 $SM——跳过安装，交给编译阶段判断"
          else
            # 许可证要先接受，否则 --install 会卡在交互提示上。
            # `yes | ...` 会产生 Broken pipe（sdkmanager 提前退出）——那是噪声，收掉。
            yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" --install "platforms;android-37" "build-tools;36.0.0" 2>&1 \
              | grep -vE 'Broken pipe' || true
          fi
          echo "已装平台：";     ls "$SDK"/platforms    2>/dev/null || echo "  （读不到）"
          echo "已装 build-tools："; ls "$SDK"/build-tools 2>/dev/null || echo "  （读不到）"

      - name: 对齐 compileSdkMinor 与实际装上的平台
        # API 37 只以次要版本发行（android-37.0 / 37.1），没有裸的 android-37。
        # AGP 找的是精确 hash：写 0 就找 37.0，写 1 就找 37.1。
        # 号码对不上时报 "Failed to find target with hash string ..."，
        # 和"平台根本没装"是同一句话——所以这里直接读实际装了哪个，
        # 改掉文件里那个默认值，并把改了什么打出来。
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          minor=$(ls -d "$SDK"/platforms/android-37.* 2>/dev/null \
                  | sed 's#.*/android-37\.##' | sort -n | head -1)
          if [ -z "$minor" ]; then
            echo "[warn] 没找到 android-37.x —— 保留文件里的默认值，交给编译阶段判断"
            echo "       已装平台：$(ls "$SDK"/platforms 2>/dev/null | tr '\n' ' ')"
          else
            echo "检测到 android-37.$minor —— 把 compileSdkMinor 对齐为 $minor"
            sed -i "s/^ *compileSdkMinor = .*/    compileSdkMinor = $minor/" app/build.gradle.kts
            grep -n 'compileSdkMinor' app/build.gradle.kts | grep -v '\*'
          fi

      - name: 取一个确定版本的 Gradle
        # 仓库里没有 gradlew wrapper —— wrapper 的 jar 是二进制，我这边生成不了。
        # 所以显式下载固定版本，而不是依赖 runner 预装的 gradle：
        # 预装版本与 AGP 要求不符时，报错是 "Minimum supported Gradle version is ..."，
        # 而它不会告诉你该装哪个。钉死在这里改起来更直接。
        #
        # ⚠️ 9.3.1 是 AGP 9.1.1 的**硬下限**（官方兼容表）。
        #    改 gradle/libs.versions.toml 里的 agp 时，必须同步这里的 GRADLE_VER——
        #    这两处不一致，会在 sync 阶段就挂掉。
        env:
          GRADLE_VER: ${{ vars.GRADLE_VER || '9.3.1' }}
        run: |
          echo "下载 Gradle $GRADLE_VER"
          cd /tmp
          curl -sSLO "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          unzip -q "gradle-${GRADLE_VER}-bin.zip"
          echo "$PWD/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"

      - name: 构建 APK（装不上 android-37 时自动退到 36）
        # 用 assembleDebug 而不是 Release：Release 需要签名密钥，
        # 而仓库里不该放密钥。要签发正式包时，在 CI 里配 secrets 并
        # 在 app/build.gradle.kts 增加 signingConfig，别把 keystore 提交进来。
        #
        # ⚠️ 为什么带回退：
        #    android-37 平台不一定装得上（上一步已经尽力了）。
        #    装不上时 AGP 报 "Failed to find target with hash string 'android-37'"，
        #    而那时**整条链还没真跑过**——我们并不确定 37 之外还有什么问题。
        #
        #    所以：先试 37；失败就把 compileSdk 改成 36 再试一次。
        #    36 那条路同样会撞上 Compose 1.12.0 的 AAR 硬校验
        #    （它要求 compileSdk ≥ 37），所以**预期也会失败**——
        #    但两次失败放一起看，能立刻分清是"平台装不上"还是"版本链不对"，
        #    而不是对着一条报错猜。
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: |
          mkdir -p dist
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          echo "可用平台：$(ls "$SDK"/platforms 2>/dev/null | tr '\n' ' ')"

          if gradle :app:assembleDebug --no-daemon --stacktrace; then
            echo "[ok] compileSdk 37 构建成功"
          else
            echo
            echo "[i] 37 构建失败。先分清是'平台没装上'还是'版本链不对'："
            if ! ls -d "$SDK"/platforms/android-37* >/dev/null 2>&1; then
              echo "    → android-37 平台**确实没装到**（上一部的探测输出里也没有它）。"
              echo
              echo "    这时只剩两条路，没有第三条："
              echo "      A. 换更新的 runner 镜像（改本 job 的 runs-on）——"
              echo "         官方对应：API 37 ↔ AGP 9.1.1 ↔ Gradle 9.3.1"
              echo "                  ↔ Android Studio Panda 3（2025.3.3 Patch 1）"
              echo "      B. 走降级：AGP 8.13.2 + Gradle 8.13 + compileSdk 36"
              echo "         + Compose BOM 2026.06 + material3 1.4.0（丢掉 Expressive）"
              echo
              echo "    下面是**诊断性**重试：临时改成 36 再编一次。"
              echo "    ⚠️ 预期也会失败——Compose 1.12.0 的 AAR 同样要求 compileSdk ≥ 37。"
              echo "    目的不是让 36 成功，而是用两次结果确认'罪魁祸首是平台缺失'。"
              sed -i 's/^ *compileSdk = 37/    compileSdk = 36/' app/build.gradle.kts
              gradle :app:assembleDebug --no-daemon --stacktrace || {
                echo
                echo "    36 也失败（符合预期）→ 确认是平台缺失，不是版本链。"
                echo "    请在上一步的探测输出里确认渠道里到底有没有 android-37，"
                echo "    然后选 A 或 B。详见 docs/TASK6-整合与出包.md 4.5 节。"
                exit 1; }
            else
              echo "    → 平台**在**，那就是版本链的问题（AGP/Gradle/BOM/Compose 之一）。"
              echo "      对照 docs/TASK6-整合与出包.md 4.5 节检查那四个版本。"
              exit 1
            fi
          fi

          cp app/build/outputs/apk/debug/app-debug.apk dist/boss-app-debug.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: boss-app
          path: dist/boss-app-debug.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 静态二进制（x86_64 / aarch64）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          mkdir -p dist
          make static
          cp build/boss-static dist/boss-linux-x86_64
          aarch64-linux-gnu-gcc -O2 -std=c11 -Wall -Wextra -DBOSS_NO_DLOPEN \
            -static-pie -Isrc src/*.c -o dist/boss-linux-aarch64

      - name: 冒烟测试仍然要过
        run: bash tools/smoke_test.sh

      # 出包前把任务3 组件的边界语义也过一遍：
      # 发布的是给用户刷机的二进制，静默读错属性这类问题必须挡在发布前。
      - name: 组件深度验收也要过
        run: bash tools/component_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: boss-linux
          path: dist/boss-linux-*
          if-no-files-found: error

  release:
    needs: [android, apk, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh 必须在 git 仓库里运行：它靠 .git 推断目标仓库（owner/repo）。
      # 这个 job 以前只下载 artifact、没有 checkout，于是 gh 直接
      # "fatal: not a git repository" 失败。artifact 是别的 job 产出的，
      # 但 gh 不关心产物从哪来，它只认工作目录里的 .git。
      # fetch-depth: 0 是为了让 gh release create 在 tag 尚不存在时
      # 能正确定位默认分支 HEAD。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打包并算校验和
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt && ls -l

      - name: 自检（发布前把环境说清楚，失败了不用猜）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "TAG=$TAG"
          echo "git repo: $(git rev-parse --show-toplevel 2>&1)"
          echo "remote  : $(git remote get-url origin 2>&1)"
          # 提前暴露问题：没有 token / 不在仓库里 / out 为空，
          # 否则错误会推迟到 gh 那一步，信息更少。
          [ -n "$TAG" ] || { echo "ERROR: TAG 为空"; exit 1; }
          ls -l out | sed -n '1,20p'
          [ -n "$(ls -A out)" ] || { echo "ERROR: out 是空的"; exit 1; }
          gh --version | head -1
          gh repo view --json nameWithOwner -q .nameWithOwner

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --generate-notes
          fi
