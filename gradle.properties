org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 非传递性 R：只生成自己模块的 R 类，编译更快，也避免误引用别的模块的资源 id。
kotlin.code.style=official

# ⚠️ 这里**故意不写** android.suppressUnsupportedCompileSdk。
# 构建时 Gradle 会建议加它，但它压的是"AGP 只测试到 compileSdk 35"的提醒，
# 与真正的失败无关。真正的失败是 checkDebugAarMetadata 的 29 个问题——
# 那是 AAR 元数据硬校验。加了这行，警告没了，29 个问题一个不少，
# 而且少了一条线索。修法是升 AGP/Gradle/compileSdk（见 libs.versions.toml 顶部注释），
# 不是压警告。

# ⚠️ 这里**故意不写** android.builtInKotlin=false。
# 那是 AGP 9 的兼容退路（关掉内置 Kotlin、回到手动声明 kotlin.android 插件），
# 官方说它会在 AGP 10 里移除。用它等于把已经迁好的东西退回旧模型，
# 而且会让上面刚删掉的 kotlin.android 重新变成"必须"——自相矛盾。
# 除非某个第三方插件明确不支持 AGP 9 且别无他法，否则别开。

# 让 AGP 自己去补缺失的 SDK 组件（平台 / build-tools）。
#   CI 上 sdkmanager 装不到 android-37 时，这是第二条路：
#   AGP 缺平台时会尝试自动下载，而不是直接报
#   "Failed to find target with hash string 'android-37'"。
#   开了它不代表一定能拿到（同样受渠道限制），但多一层机会，且不影响本地。
android.builder.sdkDownload=true
