org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 非传递性 R：只生成自己模块的 R 类，编译更快，也避免误引用别的模块的资源 id。
kotlin.code.style=official

# ⚠️ 这里**故意不写** android.suppressUnsupportedCompileSdk。
# 构建时 Gradle 会建议加它，但它压的是"AGP 只测试到 compileSdk 35"的提醒，
# 与真正的失败无关。真正的失败是 checkDebugAarMetadata 的 29 个问题——
# 那是 AAR 元数据硬校验。加了这行，警告没了，29 个问题一个不少，
# 而且少了一条线索。修法是升 AGP/Gradle/compileSdk（见 libs.versions.toml 顶部注释），
# 不是压警告。
