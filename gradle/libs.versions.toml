# BOSS · 版本目录
#
# ⚠️ 版本号需要按 Android 官网校准后再首次构建。
#
# ---------------------------------------------------------------------------
# 这四个版本是一条链，动一个必须一起动（chain，不是四个独立数字）：
#
#   compileSdk 37  ──需要──►  AGP ≥ 9.1.1  ──需要──►  Gradle ≥ 9.3.1
#        ▲                        │
#        │                        └──内置──►  KGP 2.2.10（低于它会自升）
#        │
#        └──被谁逼的：Compose BOM 2026.08.00 把 ui/foundation 锁在 1.12.0，
#                     1.12.0 的 AAR 元数据声明 "compileSdk ≥ 37 + AGP ≥ 9.1.0"
#
# 第一次构建就撞在最后一条上：checkDebugAarMetadata 报 29 个问题，
# 全部是 "requires compileSdk 37 / requires AGP 9.1.0"。
# 注意这不是警告、不是报错，而是 **AAR 元数据硬校验**，绕不过去。
#
# ⚠️ 别用 android.suppressUnsupportedCompileSdk 去压。
#    它压的是另一件事（"AGP 只测试到 compileSdk 35" 的提醒），
#    压完这 29 个 AAR 校验照样失败。它只会让真正的错误信息消失得更早。
#
# ---------------------------------------------------------------------------
# material3 仍然锁死 1.5.0-alpha27：
#    Material 3 Expressive 目前只有 alpha。官方明确过——1.4.0 是最后一个稳定版，
#    Expressive API 在 1.5.0 才转稳定。**别用 BOM 覆盖掉它**：
#    BOM 会把它拉回稳定版，于是 MaterialExpressiveTheme / MotionScheme
#    全部 unresolved，报错信息完全不会提示"版本被 BOM 换掉了"。
#
#    代价就是要跟着吃 compileSdk 37 这条链。官方说过 1.5.0 会在 2026 年内转稳定，
#    转稳后（以及 BOM 跟进后）这条链可能重新松动，届时再回来校准。
[versions]
# AGP 9.1.1 是官方声明"支持 API 37.0 及以下"的版本（AGP 9.0.x 最高只接受 36）。
agp = "9.1.1"
# Kotlin 2.3 与 AGP 9.x 配对有个隐藏下限：AGP 9.0.28 之前不支持 Kotlin 2.3。
# 9.1.1 > 9.0.28，安全。另外 AGP 9.x 内置了 KGP，低于 2.2.10 会自动升。
kotlin = "2.3.0"
# CI 的 release.yml 里 GRADLE_VER 必须与 AGP 9.1.1 的 Gradle 下限对齐（9.3.1）。
# 仓库没有 gradlew wrapper（wrapper jar 是二进制），所以那里是手工下载的。
composeBom = "2026.08.00"
material3 = "1.5.0-alpha27"
activityCompose = "1.11.0"
lifecycle = "2.9.0"
coreSplashscreen = "1.0.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# 图标必须挂 extended 而不是 core：Home 在 core 里，
# 但 Extension / Security / VisibilityOff 只在 extended。
# 挂错的报错是 "Unresolved reference: Extension"，不会提示换依赖。
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
# 遍历 SAF 目录 Uri（payload 是一个目录，不是单文件）。
# 用 SAF 的 DocumentFile 而不是自己去拼 DocumentsContract 查询——后者代码量
# 大得多，而且很容易在某个 ROM 的 DocumentsProvider 上踩空。
androidx-documentfile = { module = "androidx.documentfile:documentfile", version = "1.1.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# ⚠️ 这里**故意没有** kotlin-android。
#    AGP 9.0 起 Kotlin 编译内置，再声明 org.jetbrains.kotlin.android 会冲突：
#      "The 'org.jetbrains.kotlin.android' plugin is no longer required
#       for Kotlin support since AGP 9.0."
#    官方迁移步骤第一步就是把它从版本目录、根脚本、模块脚本里全删掉。
#
#    kotlin 这个版本号现在**只喂给 Compose 编译器插件**——
#    Compose 编译器随 Kotlin 发布，两者版本必须一致。
#    真正的 Kotlin 编译器版本在根 build.gradle.kts 的 buildscript 里
#    （那里读不到版本目录，得手写同一份数字）。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
